[pytest]
; Ensures the project root (containing core/, agents/, rag/) is on sys.path
; regardless of how pytest is invoked. Without this, a bare `pytest ...`
; (as opposed to `python -m pytest ...`) does not add the invocation
; directory to sys.path, so `from core...` / `from agents...` imports fail
; with "ModuleNotFoundError: No module named 'core'" even though the code
; itself is correct. This is pre-existing and unrelated to the C1/C2/C3/C4/
; H1/H2/H3/H4 remediation changes.
pythonpath = .
testpaths = tests
