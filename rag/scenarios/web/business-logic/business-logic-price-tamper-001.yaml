# Category: Business Logic
# Source: re-implemented (2026-11-25 harvest round) from the general business-logic
# hunting methodology in Claude-BugHunter (github.com/elementalsouls/Claude-BugHunter)
# hunt-business-logic skill, content licensed CC BY 4.0 International; adapted into
# this framework's own scenario schema, not copied verbatim. See work.md.
name: "Server-side price/amount trust failure in checkout flow"
id: "business-logic-price-tamper-001"
category: "business_logic"
subcategory: "checkout_price_tampering"
difficulty: "practitioner"
estimated_time: "45 minutes"

description: |
  Many checkout/payment flows compute a price or total client-side and submit
  it as a plain form field or JSON field, trusting the client's number instead
  of re-deriving it server-side from the canonical product/price database.
  Confirming this requires actually completing (or getting the server to
  accept) a tampered amount, not just observing that a price field exists in
  the request -- a field existing is not evidence it is trusted.

learning_objectives:
  - Identify where price/amount/currency fields are set client-side vs re-validated server-side
  - Intercept and tamper with an in-flight checkout/payment request
  - Distinguish a cosmetic client-side-only gate from a real server-side authorization gap
  - Recognize payment-webhook endpoints that skip signature/HMAC validation as a related, separately-confirmable gap

tools:
  - Burp Suite (or any intercepting proxy)
  - curl

prerequisites:
  - A checkout, order, or payment-initiation endpoint reachable with a test account
  - State-changes-allowed authorization for this engagement (this probe, if it succeeds, creates a real order/charge)

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Locate where the price/total/currency fields are set in the client request"
    commands:
      - "# Intercept the checkout/payment-initiate request in a proxy"
      - "# Identify the exact field names carrying price/amount/currency/order_id/product_id"
      - "grep -iE \"(price|amount|total|cost)\\s*[=*+]\" app.js   # check if the client computes the number itself"
    expected_output: "A captured baseline request with the legitimate price field and value identified"
    detection: "None -- this step only inspects traffic already generated by a normal checkout"

  - id: "step2"
    phase: "exploitation"
    action: "Replay the request with a tampered amount and observe server behavior"
    commands:
      - "# Modify the intercepted request: set amount/price/total to a trivially low value (e.g. 0.01)"
      - "# Resend and observe whether the server accepts it as-is, or re-derives the price itself"
      - "# Separately: check whether a payment-confirmation webhook endpoint validates an HMAC/signature"
      - "curl -X POST https://<target>/payment/callback -d '{\"status\":\"success\",\"amount\":\"0.01\",\"order_id\":\"<id>\"}'"
    expected_output: "The server accepts the tampered amount as the order's real charge, or the webhook accepts an unsigned fake success notification"
    detection: "Payment-provider-side logs showing a mismatch between the amount charged and the amount recorded as fulfilled"

  - id: "step3"
    phase: "validation"
    action: "Confirm real financial impact, not just a request that was accepted"
    commands:
      - "# Verify the order was actually fulfilled/marked paid at the tampered amount"
      - "# Capture the exact before/after: expected server-recomputed price, observed accepted client price"
    expected_output: "A reproducible demonstration that the server trusted the client-supplied amount for a real order/charge"
    detection: "None beyond step 2 -- this step is analysis of the captured evidence"

compliance_controls:
  - standard: "OWASP"
    control: "A04:2021"
    description: "Insecure Design (business logic trust boundary)"
  - standard: "MITRE ATT&CK"
    control: "T1565.001"
    description: "Stored Data Manipulation (price/order record)"

detection:
  network_indicators:
    - "Checkout/payment requests where the client-submitted amount does not match the product catalog price"
  log_indicators:
    - "Fulfilled orders whose recorded charge amount is inconsistent with the item's canonical price"
  endpoint_indicators:
    - "Payment webhook endpoints accepting requests with no valid provider signature"

remediation:
  immediate:
    - "Re-derive price/total server-side from the canonical product database on every order; never trust a client-submitted amount"
    - "Require and verify a provider HMAC/signature on every payment webhook before marking an order fulfilled"
  long_term:
    - "Move all pricing logic server-side; treat any client-submitted financial field as a hint, never a source of truth"
    - "Add integration tests that submit a tampered amount and assert the server-recomputed price wins"

variables:
  target_url: "https://target.example/payment/initiate"
  tampered_amount: "0.01"

assessment_questions:
  - "Why is a price field appearing in a request not itself evidence of a vulnerability?"
  - "What's the difference between a UI-only verification gate and a server-enforced one?"
  - "Why must a payment webhook validate a signature rather than trusting any POST body?"

references:
  - url: "https://owasp.org/www-project-top-10-client-side-security-risks/"
    title: "OWASP client-side trust risks"
  - url: "https://portswigger.net/web-security/logic-flaws"
    title: "PortSwigger Business Logic Vulnerabilities"
