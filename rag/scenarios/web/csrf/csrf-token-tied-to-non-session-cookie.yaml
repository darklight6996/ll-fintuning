# Category: Cross-Site Request Forgery (CSRF)
name: "CSRF where token is tied to non-session cookie"
id: "csrf-token-tied-to-non-session-001"
category: "csrf"
subcategory: "bypass"
difficulty: "practitioner"
estimated_time: "45 minutes"

description: |
  This scenario covers CSRF where the CSRF token is tied to a cookie, but that
  cookie is not the session cookie. The attacker can exploit this by setting
  the cookie value through a CSRF vulnerability, then using the matching token.

learning_objectives:
  - Understand cookie-based CSRF token validation
  - Identify when token is tied to a non-session cookie
  - Exploit cookie setting vulnerabilities to match tokens
  - Perform CSRF attacks using crafted cookies

tools:
  - Burp Suite
  - curl

prerequisites:
  - Target application with cookie-based token validation
  - Ability to set the cookie via CRLF injection or other means

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Examine cookie and token relationship"
    commands:
      - "# Observe the cookie associated with the CSRF token"
      - "# Note if the cookie is the session cookie or a separate one"
    expected_output: "Token is tied to a non-session cookie"
    detection: "None"

  - id: "step2"
    phase: "exploitation"
    action: "Set the cookie and use the matching token"
    commands:
      - "# If you can set the cookie (e.g., via a CRLF injection or another vulnerability)"
      - "# Set cookie to a known value and obtain the matching token"
      - "# Then use both in a CSRF request"
    expected_output: "Request is accepted with the crafted cookie and token"
    detection: "Application logs show token and cookie mismatch"

  - id: "step3"
    phase: "post_exploitation"
    action: "Escalate to account takeover"
    commands:
      - "# Use the technique to perform state-changing actions"
    expected_output: "Victim's account compromised"
    detection: "Security alerts for suspicious patterns"

compliance_controls:
  - standard: "MITRE ATT&CK"
    control: "T1204"
    description: "User Execution"
  - standard: "OWASP"
    control: "A01:2021"
    description: "Broken Access Control"

detection:
  network_indicators:
    - "Requests with inconsistent cookie-token pairs"
  log_indicators:
    - "Token validation failures"
  endpoint_indicators:
    - "None"

remediation:
  immediate:
    - "Tie CSRF tokens to the session cookie, not a separate cookie"
    - "Use secure cookie attributes (HttpOnly, Secure, SameSite)"
  long_term:
    - "Implement double-submit cookie with session binding"
    - "Use framework-level CSRF protection"

variables:
  target_url: "https://target.com/change-email"
  cookie_name: "csrf_cookie"
  token_value: "abc123"

assessment_questions:
  - "Why is using a non-session cookie for CSRF tokens insecure?"
  - "How can an attacker set a cookie on the victim's browser?"
  - "What is the double-submit cookie pattern?"

references:
  - url: "https://owasp.org/www-community/attacks/csrf"
    title: "OWASP CSRF"
  - url: "https://portswigger.net/web-security/csrf/bypassing-token-validation"
    title: "PortSwigger CSRF Bypass"