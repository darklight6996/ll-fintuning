# Category: Compliance - SOC2 Trust Service Criteria
name: "SOC2 Type II Security Controls Assessment"
id: "compliance-soc2-001"
category: "compliance"
subcategory: "soc2"
difficulty: "intermediate"
estimated_time: "120 minutes"

description: |
  Assess an organization's controls against SOC2 Trust Service Criteria (TSC).
  Covers Common Criteria (CC), Availability (A), and Confidentiality (C) categories
  with evidence collection procedures and control testing methodology.

learning_objectives:
  - Understand SOC2 Trust Service Criteria structure
  - Identify and document controls for each TSC category
  - Collect evidence for Type II audit period testing
  - Map controls to NIST CSF and ISO 27001

tools:
  - awscli
  - powershell
  - bash
  - spreadsheet_tool
  - evidence_collection_scripts

prerequisites:
  - Access to systems in scope for SOC2 audit
  - Understanding of SOC2 Trust Service Criteria
  - Access to policy documentation repository
  - Audit period defined (typically 12 months)

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "CC1 - Control Environment: Review organizational policies"
    commands:
      - "# Evidence collection checklist for CC1"
      - "# CC1.1 - COSO Principle 1: Commitment to integrity and ethics"
      - "# Collect: Code of conduct, ethics policy, signed acknowledgements"
      - "ls -la /policies/code_of_conduct* /policies/ethics*"
      - "# CC1.2 - Board oversight of internal control system"
      - "# Collect: Board meeting minutes, security committee charter"
      - "# CC1.3 - Organizational structure and reporting lines"
      - "# Collect: Org chart, RACI matrix, job descriptions"
      - "# CC1.4 - Competence policies"
      - "# Collect: Hiring standards, training records, performance reviews"
      - "# CC1.5 - Accountability for internal controls"
      - "# Collect: Signed policy acknowledgements, control owner assignments"
      - "grep -r 'policy_owner\\|control_owner' /policies/ 2>/dev/null | head -20"
    expected_output: "Evidence artifacts for CC1 control environment documentation"
    detection: "N/A — compliance evidence collection"

  - id: "step2"
    phase: "enumeration"
    action: "CC2 - Communication and Information: Verify internal communication controls"
    commands:
      - "# CC2.1 - Information to support internal control functioning"
      - "# Collect: Security awareness training completion records"
      - "# CC2.2 - Internal communication of control objectives"
      - "# Collect: Security policy distribution records, all-hands meeting records"
      - "# CC2.3 - Communication with external parties"
      - "# Collect: Privacy policy, vendor agreements, customer security documentation"
      - "# Check training completion rates"
      - "python3 << 'EOF'\nimport csv\nwith open('training_completions.csv') as f:\n    reader = csv.DictReader(f)\n    rows = list(reader)\n    completed = sum(1 for r in rows if r.get('status','').lower() == 'complete')\n    print(f'Training completion: {completed}/{len(rows)} ({100*completed//len(rows)}%)')\nEOF"
    expected_output: "Training completion rates and communication control documentation"
    detection: "N/A — compliance evidence collection"

  - id: "step3"
    phase: "enumeration"
    action: "CC6 - Logical and Physical Access Controls"
    commands:
      - "# CC6.1 - Logical access security measures"
      - "# Collect: IAM user list, access review reports, MFA enforcement proof"
      - "aws iam generate-credential-report && sleep 5"
      - "aws iam get-credential-report --query 'Content' --output text | base64 -d > /tmp/credential_report.csv"
      - "python3 << 'EOF'\nimport csv\nwith open('/tmp/credential_report.csv') as f:\n    reader = csv.DictReader(f)\n    issues = []\n    for row in reader:\n        if row.get('mfa_active','false').lower() == 'false' and row.get('password_enabled','false').lower() == 'true':\n            issues.append(f\"No MFA: {row['user']}\")\n        if row.get('access_key_1_active','false').lower() == 'true':\n            last_used = row.get('access_key_1_last_used_date','N/A')\n            issues.append(f\"Active key last used {last_used}: {row['user']}\")\nfor i in issues[:10]: print(i)\nprint(f'Total issues: {len(issues)}')\nEOF"
      - "# CC6.2 - Prior to issuing system credentials"
      - "# Collect: Access request tickets, approval workflows, onboarding process"
      - "# CC6.3 - Register/authorize infrastructure and software"
      - "# Collect: Asset inventory, CMDB export"
      - "aws ec2 describe-instances --query 'Reservations[*].Instances[*].{ID:InstanceId,State:State.Name,Name:Tags[?Key==`Name`]|[0].Value}' --output table"
      - "# CC6.6 - Logical access security measures for external access"
      - "# Collect: VPN configs, zero trust policy, remote access policy"
      - "# CC6.7 - Transmission of data"
      - "# Collect: TLS certificate inventory, encryption in transit policy"
      - "aws acm list-certificates --query 'CertificateSummaryList[*].{Domain:DomainName,Expiry:NotAfter}'"
    expected_output: "Access control evidence including IAM report, MFA status, and asset inventory"
    detection: "N/A — compliance evidence collection"

  - id: "step4"
    phase: "enumeration"
    action: "CC7 - System Operations: Monitoring and incident response"
    commands:
      - "# CC7.1 - Detect and monitor threats"
      - "# Collect: SIEM alert rules, vulnerability scan reports, pen test results"
      - "# Check CloudTrail is enabled"
      - "aws cloudtrail describe-trails --query 'trailList[*].{Name:Name,MultiRegion:IsMultiRegionTrail,LogValidation:LogFileValidationEnabled}'"
      - "# CC7.2 - Monitor infrastructure and software"
      - "# Collect: CloudWatch alarms, uptime monitoring, alerting runbook"
      - "aws cloudwatch describe-alarms --state-value ALARM --query 'MetricAlarms[*].AlarmName'"
      - "aws cloudwatch describe-alarms --query 'MetricAlarms | length(@)'"
      - "# CC7.3 - Evaluate security events"
      - "# Collect: Incident log, SIEM query results, threat intel reports"
      - "# CC7.4 - Respond to security incidents"
      - "# Collect: Incident response plan, IR exercise records, post-mortems"
      - "ls -la /policies/incident_response* /runbooks/IR*"
      - "# CC7.5 - Identify and remediate vulnerabilities"
      - "# Collect: Vulnerability scan results, patch records, SLA metrics"
      - "aws inspector2 list-findings --filter-criteria '{\"findingSeverity\":[{\"comparison\":\"EQUALS\",\"value\":\"CRITICAL\"}]}' --query 'findings[*].{Title:title,Severity:severity,Status:status}' 2>/dev/null | head -20"
    expected_output: "Monitoring and operations evidence for CC7 controls"
    detection: "N/A — compliance evidence collection"

  - id: "step5"
    phase: "enumeration"
    action: "CC8 - Change Management controls"
    commands:
      - "# CC8.1 - Authorize, design, develop, configure, document, test, approve changes"
      - "# Collect: Change request tickets, CAB meeting minutes, deployment logs"
      - "# Check for branch protection rules (GitHub example)"
      - "curl -s -H 'Authorization: token [github_token]' https://api.github.com/repos/[org]/[repo]/branches/main/protection"
      - "# Check deployment pipeline approval gates"
      - "# Collect: CI/CD pipeline configs showing required approvals"
      - "# Verify test coverage in deployments"
      - "# Collect: Test reports, code coverage metrics"
      - "# Check for unapproved direct deployments"
      - "git log --oneline --since='90 days ago' | wc -l"
    expected_output: "Change management evidence including approval gates, test results, deployment logs"
    detection: "N/A — compliance evidence collection"

  - id: "step6"
    phase: "enumeration"
    action: "CC9 - Risk Mitigation and Vendor Management"
    commands:
      - "# CC9.1 - Risk mitigation activities"
      - "# Collect: Risk register, risk treatment plans, annual risk assessment"
      - "ls -la /risk/risk_register* /risk/annual_assessment*"
      - "# CC9.2 - Vendor and business partner risk management"
      - "# Collect: Vendor risk assessments, BAAs, DPAs, vendor security questionnaires"
      - "python3 << 'EOF'\nimport json, datetime\nvendors = json.load(open('vendor_inventory.json'))\nexpired = [v for v in vendors if datetime.datetime.fromisoformat(v.get('assessment_date','2000-01-01')) < datetime.datetime.now() - datetime.timedelta(days=365)]\nprint(f'Vendors with expired assessments: {len(expired)}')\nfor v in expired[:5]: print(f\"  {v['name']}: {v.get('assessment_date','Never')}\")\nEOF"
      - "# Availability (A1) - Availability commitments"
      - "# Collect: SLA agreements, uptime reports, DR test results"
      - "# Check current uptime metrics"
      - "aws cloudwatch get-metric-statistics --namespace AWS/ApplicationELB --metric-name HTTPCode_ELB_5XX_Count --start-time $(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%S) --end-time $(date -u +%Y-%m-%dT%H:%M:%S) --period 2592000 --statistics Sum"
    expected_output: "Risk register status, vendor assessment currency, availability metrics"
    detection: "N/A — compliance evidence collection"

  - id: "step7"
    phase: "enumeration"
    action: "Generate SOC2 evidence summary report"
    commands:
      - "cat > /tmp/soc2_evidence_summary.py << 'EOF'\nimport json, datetime\n\ncontrols = [\n    {'id': 'CC1.1', 'name': 'Integrity & Ethics Policy', 'status': 'TODO', 'evidence': []},\n    {'id': 'CC6.1', 'name': 'Logical Access Controls', 'status': 'TODO', 'evidence': []},\n    {'id': 'CC6.2', 'name': 'Access Provisioning', 'status': 'TODO', 'evidence': []},\n    {'id': 'CC7.1', 'name': 'Threat Monitoring', 'status': 'TODO', 'evidence': []},\n    {'id': 'CC7.4', 'name': 'Incident Response', 'status': 'TODO', 'evidence': []},\n    {'id': 'CC8.1', 'name': 'Change Management', 'status': 'TODO', 'evidence': []},\n    {'id': 'CC9.2', 'name': 'Vendor Management', 'status': 'TODO', 'evidence': []},\n]\n\nprint(f'SOC2 Evidence Collection Status — {datetime.date.today()}')\nprint('-' * 60)\nfor c in controls:\n    print(f\"{c['id']:10} {c['name']:35} {c['status']}\")\nprint('-' * 60)\ncomplete = sum(1 for c in controls if c['status'] == 'COMPLETE')\nprint(f'Progress: {complete}/{len(controls)} controls evidenced')\nEOF"
      - "python3 /tmp/soc2_evidence_summary.py"
    expected_output: "Summary report of SOC2 evidence collection status"
    detection: "N/A — compliance evidence collection"

compliance_controls:
  - standard: "SOC2 Trust Service Criteria"
    control: "CC1-CC9, A1, C1, PI1, P1-P8"
    description: "Full SOC2 Trust Service Criteria assessment"
  - standard: "NIST CSF v2.0"
    control: "GV, ID, PR, DE, RS, RC"
    description: "NIST Cybersecurity Framework mapping"
  - standard: "ISO 27001:2022"
    control: "A.5 - A.8"
    description: "ISO 27001 Annex A control mapping"

detection:
  network_indicators:
    - "N/A — compliance assessment is evidence collection"
  log_indicators:
    - "AWS API calls for evidence collection (read-only)"
    - "Credential report generation in CloudTrail"
  endpoint_indicators:
    - "Evidence artifacts stored in audit repository"

remediation:
  immediate:
    - "Enable MFA for all users lacking it (CC6.1 finding)"
    - "Complete security awareness training for non-compliant staff (CC1.4)"
    - "Ensure CloudTrail enabled in all regions (CC7.1)"
    - "Document and formalize any undocumented controls"
  long_term:
    - "Implement GRC platform (Vanta, Drata, Secureframe) for continuous compliance"
    - "Automate evidence collection using compliance platform integrations"
    - "Conduct annual SOC2 readiness assessment before external audit"
    - "Align control framework to support multiple standards (SOC2 + ISO 27001 + PCI)"

variables:
  audit_period_start: "2024-01-01"
  audit_period_end: "2024-12-31"
  aws_profile: "production"
  github_token: "YOUR_GITHUB_TOKEN"
  org: "your-org"
  repo: "your-repo"

assessment_questions:
  - "What is the difference between SOC2 Type I and Type II reports?"
  - "How many Trust Service Criteria categories exist in SOC2?"
  - "What evidence is required for CC6.1 logical access controls?"
  - "How does SOC2 CC7.4 relate to NIST IR-4?"
  - "What is the minimum audit period for a SOC2 Type II report?"

references:
  - url: "https://www.aicpa.org/interestareas/frc/assuranceadvisoryservices/aicpasoc2report.html"
    title: "AICPA SOC2 Overview"
  - url: "https://www.vanta.com/resources/soc-2-compliance-guide"
    title: "SOC2 Compliance Guide"
  - url: "https://us.aicpa.org/content/dam/aicpa/interestareas/frc/assuranceadvisoryservices/downloadabledocuments/trust-services-criteria.pdf"
    title: "Trust Services Criteria 2017"
