# Category: Compliance - ISO Standards
name: "ISO 27001:2022 Information Security Management Assessment"
id: "compliance-iso27001-001"
category: "compliance"
subcategory: "iso_standards"
difficulty: "intermediate"
estimated_time: "120"

tags:
  - compliance
  - iso27001
  - iso27002
  - isms
  - annex-a
  - risk-assessment
  - information-security
  - audit
  - gap-analysis
  - controls
  - governance
  - soc2-mapping
  - nist-mapping
  - evidence-collection
  - certification

description: |
  Assess an organization's Information Security Management System (ISMS) against
  ISO 27001:2022 requirements. Covers Annex A controls assessment, risk treatment
  plan review, Statement of Applicability (SoA), and audit evidence collection
  across all 93 controls in the updated 2022 standard.

learning_objectives:
  - Understand ISO 27001:2022 clause structure and Annex A control categories
  - Conduct gap analysis against ISO 27001:2022 requirements
  - Collect and document audit evidence for each applicable control
  - Map ISO controls to SOC2 and NIST 800-53 for dual-framework efficiency

tools:
  - "spreadsheet_tool"
  - "awscli"
  - "powershell"
  - "bash"
  - "python3"

prerequisites:
  - "Access to organizational ISMS documentation"
  - "Statement of Applicability (SoA) available"
  - "Risk register accessible"
  - "System and asset inventory available"

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Clause 4 — Organization context and interested parties"
    commands:
      - "# 4.1 - Understanding the organization and its context"
      - "# Evidence: SWOT or PESTLE analysis, business context document"
      - "ls -la /isms/context/ /isms/scope/ 2>/dev/null"
      - "# 4.2 - Understanding needs and expectations of interested parties"
      - "# Evidence: Stakeholder register, regulatory requirements list"
      - "# 4.3 - Determining ISMS scope"
      - "# Evidence: Scope document defining included/excluded assets, processes, locations"
      - "python3 << 'EOF'\nimport os, json\nrequired_docs = [\n    '/isms/context/organizational_context.pdf',\n    '/isms/context/stakeholder_register.xlsx',\n    '/isms/scope/isms_scope_statement.pdf',\n    '/isms/scope/soa.xlsx'\n]\nfor doc in required_docs:\n    exists = os.path.exists(doc)\n    print(f\"{'FOUND' if exists else 'MISSING':8} {doc}\")\nEOF"
    expected_output: "Context documentation status and ISMS scope definition"
    detection: "N/A — compliance evidence collection"

  - id: "step2"
    phase: "enumeration"
    action: "Clause 6 — Risk assessment and treatment"
    commands:
      - "# 6.1.2 - Information security risk assessment"
      - "# Evidence: Risk methodology document, risk register, risk assessment results"
      - "ls -la /isms/risk/ 2>/dev/null"
      - "python3 << 'EOF'\nimport json, datetime\ntry:\n    with open('/isms/risk/risk_register.json') as f:\n        risks = json.load(f)\n    print(f'Total risks: {len(risks)}')\n    high = [r for r in risks if r.get('residual_risk','').lower() in ['high','critical']]\n    print(f'High/Critical residual risks: {len(high)}')\n    no_treatment = [r for r in risks if not r.get('treatment_plan')]\n    print(f'Risks without treatment plan: {len(no_treatment)}')\n    overdue = [r for r in risks if r.get('treatment_due') and datetime.datetime.fromisoformat(r['treatment_due']) < datetime.datetime.now()]\n    print(f'Overdue treatment plans: {len(overdue)}')\nexcept FileNotFoundError:\n    print('Risk register not found — Clause 6 gap')\nEOF"
      - "# 6.1.3 - Information security risk treatment"
      - "# Evidence: Risk treatment plan, SoA with treatment decisions"
      - "# 6.2 - Information security objectives"
      - "# Evidence: Security objectives document, KPI tracking"
    expected_output: "Risk register status, residual risk levels, and treatment plan completeness"
    detection: "N/A — compliance evidence collection"

  - id: "step3"
    phase: "enumeration"
    action: "Annex A 5 — Organizational controls (37 controls)"
    commands:
      - "# A.5.1 - Policies for information security"
      - "ls -la /policies/ | grep -i 'information.security\\|isms\\|security.policy'"
      - "# Check policy approval dates"
      - "python3 << 'EOF'\nimport os, datetime\npolicies = [\n    ('/policies/information_security_policy.pdf', 'A.5.1'),\n    ('/policies/acceptable_use_policy.pdf', 'A.5.10'),\n    ('/policies/access_control_policy.pdf', 'A.5.15'),\n    ('/policies/cryptography_policy.pdf', 'A.5.33'),\n    ('/policies/supplier_security_policy.pdf', 'A.5.19'),\n]\nfor path, control in policies:\n    if os.path.exists(path):\n        mtime = datetime.datetime.fromtimestamp(os.path.getmtime(path))\n        age = (datetime.datetime.now() - mtime).days\n        status = 'CURRENT' if age < 365 else 'OVERDUE REVIEW'\n        print(f'{control}: {status} (last modified {age} days ago)')\n    else:\n        print(f'{control}: MISSING — {path}')\nEOF"
      - "# A.5.15 - Access control (check IAM)"
      - "aws iam get-account-password-policy 2>/dev/null | python3 -m json.tool | grep -E 'MinimumLength|RequireSymbols|MaxPasswordAge'"
      - "# A.5.23 - Information security for use of cloud services"
      - "# Evidence: Cloud security policy, CSP assessment records"
      - "# A.5.29 - Information security during disruption"
      - "# Evidence: BCP/DR plans, test results"
      - "ls -la /continuity/ 2>/dev/null"
    expected_output: "Policy inventory status, IAM password policy, continuity documentation"
    detection: "N/A — compliance evidence collection"

  - id: "step4"
    phase: "enumeration"
    action: "Annex A 6 — People controls (8 controls)"
    commands:
      - "# A.6.1 - Screening (background checks)"
      - "# Evidence: HR screening policy, background check records for new hires"
      - "# A.6.2 - Terms and conditions of employment"
      - "# Evidence: Employment contracts with security clauses, signed copies"
      - "# A.3 - Information security awareness, education and training"
      - "python3 << 'EOF'\ntry:\n    import csv\n    with open('/hr/training/security_awareness_completions.csv') as f:\n        rows = list(csv.DictReader(f))\n    total = len(rows)\n    complete = sum(1 for r in rows if r.get('status','').lower() == 'complete')\n    rate = round(100 * complete / total) if total else 0\n    print(f'Security awareness training: {complete}/{total} ({rate}%)')\n    if rate < 95:\n        print('WARNING: Below 95% completion threshold')\nexcept FileNotFoundError:\n    print('Training records not found — A.6.3 gap')\nEOF"
      - "# A.6.4 - Disciplinary process"
      - "# Evidence: HR disciplinary policy referencing security violations"
      - "# A.6.5 - Responsibilities after termination"
      - "# Evidence: Offboarding checklist, access revocation records"
    expected_output: "People control evidence: screening, training rates, offboarding records"
    detection: "N/A — compliance evidence collection"

  - id: "step5"
    phase: "enumeration"
    action: "Annex A 7 — Physical controls (14 controls)"
    commands:
      - "# A.7.1 - Physical security perimeters"
      - "# Evidence: Site security assessment, access control system records"
      - "# A.7.2 - Physical entry"
      - "# Evidence: Badge access logs, visitor management records"
      - "# A.7.7 - Clear desk and clear screen"
      - "# Evidence: Clear desk policy, compliance spot-checks"
      - "# A.7.9 - Security of assets off-premises"
      - "# Evidence: Remote working policy, mobile device policy, encryption evidence"
      - "# A.7.10 - Storage media"
      - "# Evidence: Media sanitization procedures, destruction certificates"
      - "# A.7.12 - Cabling security"
      - "# A.7.13 - Equipment maintenance records"
      - "python3 << 'EOF'\nimport os\nphysical_evidence = {\n    'A.7.1': '/facilities/site_security_assessment.pdf',\n    'A.7.2': '/facilities/access_control_logs/',\n    'A.7.7': '/policies/clear_desk_policy.pdf',\n    'A.7.9': '/policies/remote_working_policy.pdf',\n    'A.7.10': '/procedures/media_sanitization.pdf',\n}\nfor ctrl, path in physical_evidence.items():\n    exists = os.path.exists(path)\n    print(f'{ctrl}: {\"FOUND\" if exists else \"MISSING\"} — {path}')\nEOF"
    expected_output: "Physical control documentation status for data center and office security"
    detection: "N/A — compliance evidence collection"

  - id: "step6"
    phase: "enumeration"
    action: "Annex A 8 — Technological controls (34 controls)"
    commands:
      - "# A.8.1 - User endpoint devices (EDR coverage)"
      - "# Evidence: Endpoint inventory, EDR deployment report"
      - "# A.8.2 - Privileged access rights"
      - "aws iam list-users --query 'Users[*].UserName' --output text 2>/dev/null | tr '\\t' '\\n' | while read u; do policies=$(aws iam list-attached-user-policies --user-name $u --query 'AttachedPolicies[*].PolicyName' --output text 2>/dev/null); if echo $policies | grep -qi 'admin\\|fullaccess'; then echo \"Privileged: $u — $policies\"; fi; done"
      - "# A.8.3 - Information access restriction"
      - "# A.8.4 - Access to source code"
      - "# Evidence: Source code access controls, GitHub RBAC settings"
      - "# A.8.7 - Protection against malware"
      - "# Check EDR/AV coverage"
      - "aws ssm describe-instance-information --query 'InstanceInformationList[*].{ID:InstanceId,Platform:PlatformName,Agent:AgentVersion}' --output table 2>/dev/null | head -20"
      - "# A.8.8 - Management of technical vulnerabilities"
      - "aws inspector2 list-findings --filter-criteria '{\"findingSeverity\":[{\"comparison\":\"EQUALS\",\"value\":\"CRITICAL\"}]}' --query 'findings | length(@)' 2>/dev/null"
      - "# A.8.15 - Logging"
      - "aws cloudtrail describe-trails --query 'trailList[*].{Name:Name,MultiRegion:IsMultiRegionTrail}' 2>/dev/null"
      - "# A.8.24 - Use of cryptography"
      - "aws kms list-keys --query 'Keys | length(@)' 2>/dev/null"
      - "# A.8.28 - Secure coding"
      - "# Evidence: SAST/DAST scan reports, secure coding standards"
    expected_output: "Technological control coverage across endpoint, access, vulnerability, logging, and crypto"
    detection: "N/A — compliance evidence collection"

  - id: "step7"
    phase: "post_exploitation"
    action: "Generate ISO 27001 gap analysis report"
    commands:
      - "python3 << 'EOF'\nimport json, datetime\n\ngap_analysis = {\n    'assessment_date': str(datetime.date.today()),\n    'standard': 'ISO 27001:2022',\n    'clauses': {\n        'Clause 4 - Context': {'status': 'Partial', 'gaps': ['Stakeholder register not formal']},\n        'Clause 5 - Leadership': {'status': 'Conforming', 'gaps': []},\n        'Clause 6 - Planning': {'status': 'Partial', 'gaps': ['Risk treatment overdue items']},\n        'Clause 7 - Support': {'status': 'Conforming', 'gaps': []},\n        'Clause 8 - Operation': {'status': 'Partial', 'gaps': ['DR test not documented']},\n        'Clause 9 - Performance': {'status': 'Partial', 'gaps': ['Internal audit overdue']},\n        'Clause 10 - Improvement': {'status': 'Conforming', 'gaps': []},\n    },\n    'annex_a_summary': {\n        'total_controls': 93,\n        'applicable': 87,\n        'fully_implemented': 71,\n        'partially_implemented': 12,\n        'not_implemented': 4,\n        'not_applicable': 6,\n    }\n}\n\nprint('ISO 27001:2022 GAP ANALYSIS SUMMARY')\nprint('=' * 50)\nprint(f'Date: {gap_analysis[\"assessment_date\"]}')\nprint()\nfor clause, data in gap_analysis['clauses'].items():\n    status = data['status']\n    symbol = 'OK' if status == 'Conforming' else '!!'\n    print(f'[{symbol}] {clause}: {status}')\n    for gap in data['gaps']:\n        print(f'     > Gap: {gap}')\nprint()\nannex = gap_analysis['annex_a_summary']\nprint('Annex A Controls:')\nprint(f'  Fully implemented:    {annex[\"fully_implemented\"]}/{annex[\"applicable\"]}')\nprint(f'  Partially implemented: {annex[\"partially_implemented\"]}')\nprint(f'  Not implemented:       {annex[\"not_implemented\"]}')\nEOF"
    expected_output: "Gap analysis report with clause conformance status and Annex A control coverage"
    detection: "N/A — report generation"

compliance_controls:
  - standard: "ISO 27001:2022"
    control: "All Clauses 4-10 and Annex A"
    description: "Full ISO 27001:2022 ISMS assessment"
  - standard: "SOC2 CC1-CC9"
    control: "Cross-mapped"
    description: "ISO 27001 to SOC2 control mapping for dual certification"
  - standard: "NIST 800-53 Rev5"
    control: "Cross-mapped"
    description: "ISO 27001 to NIST control family mapping"

detection:
  network_indicators:
    - "N/A — compliance assessment"
  log_indicators:
    - "AWS read-only API calls for evidence collection"
  endpoint_indicators:
    - "Evidence artifacts stored in ISMS document repository"

remediation:
  immediate:
    - "Complete overdue risk treatment plans (Clause 6.1.3)"
    - "Achieve 95%+ security awareness training completion (A.6.3)"
    - "Conduct and document internal audit if overdue (Clause 9.2)"
    - "Formalize and approve any undocumented policies"
  long_term:
    - "Implement GRC platform for continuous ISO 27001 control monitoring"
    - "Schedule annual management review and internal audit cycles"
    - "Align remediation roadmap to Statement of Applicability"
    - "Consider integrated ISO 27001 + SOC2 + PCI audit approach"

variables:
  organization: "Example Corp"
  assessment_date: "2024-01-01"
  certification_body: "BSI"
  next_surveillance_audit: "2024-06-01"

assessment_questions:
  - "What is the difference between ISO 27001 and ISO 27002?"
  - "What is a Statement of Applicability (SoA) and what must it contain?"
  - "How many Annex A controls exist in ISO 27001:2022 versus the 2013 version?"
  - "What is the minimum frequency for ISO 27001 internal audits?"
  - "How does ISO 27001 risk assessment differ from quantitative risk analysis?"

references:
  - url: "https://www.iso.org/standard/27001"
    title: "ISO/IEC 27001:2022 Standard"
  - url: "https://www.iso.org/standard/75652.html"
    title: "ISO/IEC 27002:2022 Controls"
  - url: "https://www.bsigroup.com/en-GB/ISO-27001-Information-Security/"
    title: "BSI ISO 27001 Certification"
