name: "CI/CD Pipeline Secret Leakage"
id: "CM-03"
category: "Change Management & DevOps"
subcategory: "Process + Technical"
difficulty: "intermediate"
estimated_time: "45"

tags:
  - cicd
  - secrets
  - github
  - gitlab
  - azure-devops
  - gitleaks
  - trufflehog
  - credential-access
  - cloud
  - devsecops
  - authentication
  - repository
  - pipeline
  - soc2
  - cc6.1
  - cc7.1
  - compliance
  - secret-scanning

description: |
  Scan CI/CD pipelines and repositories for hardcoded secrets,
  API keys, and credentials. Validates SOC 2 CC6.1 (Logical Access).

learning_objectives:
  - Scan GitHub Actions, GitLab CI, and Azure DevOps pipelines for secrets
  - Identify hardcoded credentials in source code
  - Check for exposed secrets in build logs and artifacts
  - Verify secret scanning tools are enabled
  - Test for secret rotation after exposure

tools:
  - "GitLeaks"
  - "TruffleHog"
  - "GitHub secret scanning"
  - "Azure DevOps security scanning"
  - "PowerShell / Bash"

prerequisites:
  - "Repository read access"
  - "CI/CD pipeline configuration access"
  - "Secret scanning tools installed"

steps:
  - id: "step1"
    phase: "enumeration"
    action: "Scan repository for hardcoded secrets"
    commands:
      - "gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json"
      - "trufflehog filesystem . --json > trufflehog-report.json"
    expected_output: "JSON reports with identified secrets, locations, and entropy scores"
    detection: "N/A - security scanning"

  - id: "step2"
    phase: "enumeration"
    action: "Check CI/CD pipeline files for embedded secrets"
    commands:
      - "# Scan workflow files"
      - "grep -r -i 'password|secret|token|key|api_key|client_secret' .github/workflows/ .gitlab-ci.yml azure-pipelines.yml 2>/dev/null | grep -v 'secrets.' | head -50"
      - "# Check for base64-encoded secrets"
      - "grep -r -E '^[A-Za-z0-9+/]{40,}={0,2}$' .github/workflows/ .gitlab-ci.yml 2>/dev/null"
    expected_output: "Potential hardcoded secrets in pipeline configuration files"
    detection: "N/A - security scanning"

  - id: "step3"
    phase: "enumeration"
    action: "Check build logs for secret exposure"
    commands:
      - "# GitHub Actions logs"
      - "gh run list --repo {owner}/{repo} --limit 50 | head -20"
      - "gh run view {run_id} --repo {owner}/{repo} --log | grep -i -E 'password|secret|token|key|AWS_|AZURE_'"
      - "# Azure DevOps build logs"
      - "az pipelines runs list --pipeline-id {pipeline_id} --top 20 --query '[].{Id:id, BuildNumber:buildNumber, Result:result}' -o table"
    expected_output: "Build log entries potentially exposing secrets"
    detection: "N/A - security scanning"

  - id: "step4"
    phase: "verification"
    action: "Verify secret scanning is enabled on repository"
    commands:
      - "gh api repos/{owner}/{repo} --jq '{secret_scanning_status: .security_and_analysis.secret_scanning.status, secret_scanning_push_protection: .security_and_analysis.secret_scanning_push_protection.status}'"
      - "# Check for GitHub Advanced Security"
      - "gh api repos/{owner}/{repo} --jq '{has_advanced_security: .security_and_analysis.advanced_security.status}'"
    expected_output: "Secret scanning and push protection configuration status"
    detection: "N/A - configuration audit"

  - id: "step5"
    phase: "exploitation"
    action: "Test if discovered secrets are still valid"
    commands:
      - "# Test Azure service principal secret"
      - "az login --service-principal --username {client_id} --password {discovered_secret} --tenant {tenant_id}"
      - "# Test AWS access key"
      - "aws configure set aws_access_key_id {discovered_key}"
      - "aws configure set aws_secret_access_key {discovered_secret}"
      - "aws sts get-caller-identity"
    expected_output: "Successful authentication confirming active, unrotated secret"
    detection: "Authentication attempts with exposed credentials"

  - id: "step6"
    phase: "post_exploitation"
    action: "Generate secret exposure risk report"
    commands:
      - "TotalSecretsFound: 12; HighEntropySecrets: 5; ActiveSecrets: 3; SecretScanningEnabled: true; PushProtectionEnabled: false; BuildLogExposure: 2; PassRate: 42%"
    expected_output: "Secret exposure risk metrics for SOC 2 evidence"
    detection: "N/A - audit reporting"

compliance_controls:
  - standard: "SOC 2"
    control: "CC6.1"
    description: "Logical access controls - credential protection in CI/CD"
  - standard: "SOC 2"
    control: "CC7.1"
    description: "Detection - secret scanning and exposure prevention"
  - standard: "NIST 800-53"
    control: "IA-5"
    description: "Authenticator Management - credential storage"

detection:
  network_indicators:
    - "Authentication attempts from CI/CD IP ranges using discovered credentials"
  log_indicators:
    - "GitHub secret scanning alerts"
    - "Azure AD sign-ins with service principal credentials from build agents"
    - "AWS CloudTrail events with exposed access keys"
  endpoint_indicators:
    - "Secret scanning tool execution in repositories"
    - "Credential testing commands from developer workstations"

remediation:
  immediate:
    - "Rotate all discovered active secrets immediately"
    - "Enable GitHub secret scanning and push protection"
    - "Remove hardcoded secrets from pipeline files; use secret variables"
    - "Purge build logs containing exposed secrets"
  long_term:
    - "Implement Azure Key Vault / AWS Secrets Manager integration in all pipelines"
    - "Require secret scanning in CI/CD pipeline before merge"
    - "Deploy pre-commit hooks with secret detection"
    - "Implement automated secret rotation policies"
    - "Use OIDC federation instead of long-lived secrets for cloud authentication"
    - "Enable GitHub Advanced Security organization-wide"

variables:
  owner: "[REPO_OWNER]"
  repo: "[REPO_NAME]"
  pipeline_id: "[AZURE_DEVOPS_PIPELINE_ID]"
  tenant_id: "[TARGET_TENANT_ID]"

assessment_questions:
  - "How many active secrets were found in repositories or pipelines?"
  - "Is secret scanning enabled on all repositories?"
  - "Is push protection blocking commits with secrets?"
  - "Are build logs sanitized to prevent secret exposure?"

references:
  - url: "https://github.com/zricethezav/gitleaks"
    title: "GitLeaks - Secret Scanner"
  - url: "https://github.com/trufflesecurity/trufflehog"
    title: "TruffleHog - Secret Discovery"
  - url: "https://docs.github.com/en/code-security/secret-scanning/about-secret-scanning"
    title: "GitHub Secret Scanning"
