name: "Key Vault Secret Dump & Access Control Validation"
id: "AZ-05"
category: "Cloud Security"
subcategory: "Azure / Cloud Security"
difficulty: "intermediate"
estimated_time: "35"

tags:
  - azure
  - key-vault
  - secret-management
  - credential-access
  - access-control
  - soft-delete
  - purge-protection
  - encryption
  - rbac
  - soc2
  - cc6.1
  - cc6.3
  - compliance
  - secrets

description: |
  Audit Azure Key Vault access policies, secret versions, and key permissions to
  identify excessive access, unrotated secrets, and missing soft-delete protection.
  Maps to SOC 2 CC6.1 (Logical Access) and CC6.3 (RBAC).

learning_objectives:
  - Enumerate Key Vaults and their access policies
  - Identify principals with excessive secret/key permissions
  - List all secrets/keys and their creation/expiration dates
  - Verify soft-delete and purge protection are enabled
  - Test if secrets can be retrieved without proper authorization

tools:
  - "Azure CLI"
  - "Azure PowerShell (Az module)"
  - "PowerShell"
  - "Steampipe"

prerequisites:
  - "Azure subscription with Key Vault access (Reader or Secret User)"
  - "Azure CLI or Az PowerShell module"
  - "Network access to *.vault.azure.net endpoints"

steps:
  - id: "step1"
    phase: "enumeration"
    action: "List all Key Vaults and their security configurations"
    commands:
      - "az keyvault list --query '[].{Name:name, ResourceGroup:resourceGroup, SoftDelete:properties.enableSoftDelete, PurgeProtection:properties.enablePurgeProtection, RBAC:properties.enableRbacAuthorization, NetworkRule:properties.networkAcls.defaultAction}' -o table"
      - "Get-AzKeyVault | Select-Object VaultName, ResourceGroupName, @{N='SoftDelete';E={$_.EnableSoftDelete}}, @{N='PurgeProtection';E={$_.EnablePurgeProtection}}, @{N='RBACAuth';E={$_.EnableRbacAuthorization}}, @{N='NetworkDefault';E={$_.NetworkAcls.DefaultAction}} | Export-Csv -Path 'keyvaults.csv' -NoTypeInformation"
    expected_output: "All Key Vaults with soft-delete, purge protection, RBAC, and network settings"
    detection: "Key Vault list operations in Azure Activity Logs"

  - id: "step2"
    phase: "enumeration"
    action: "Enumerate access policies and RBAC assignments"
    commands:
      - "# For access policy vaults"
      - "az keyvault show --name {vault_name} --query 'properties.accessPolicies[].{TenantId:tenantId, ObjectId:objectId, Permissions:permissions}' -o json"
      - "# For RBAC-enabled vaults"
      - "az role assignment list --scope $(az keyvault show --name {vault_name} --query 'id' -o tsv) --query '[].{Principal:principalName, Role:roleDefinitionName, Scope:scope}' -o table"
      - "Get-AzKeyVault -VaultName {vault_name} | Select-Object -ExpandProperty AccessPolicies | Select-Object DisplayName, ObjectId, @{N='SecretPerms';E={$_.PermissionsToSecrets -join ','}}, @{N='KeyPerms';E={$_.PermissionsToKeys -join ','}}, @{N='CertPerms';E={$_.PermissionsToCertificates -join ','}} | Export-Csv -Path 'kv_access_policies.csv' -NoTypeInformation"
    expected_output: "All access policies and RBAC assignments with granular permissions"
    detection: "Key Vault access policy reads; RBAC assignment enumeration"

  - id: "step3"
    phase: "enumeration"
    action: "List all secrets, keys, and certificates with metadata"
    commands:
      - "az keyvault secret list --vault-name {vault_name} --query '[].{Name:name, Enabled:attributes.enabled, Created:attributes.created, Expires:attributes.expires, RecoveryLevel:attributes.recoveryLevel}' -o table"
      - "az keyvault key list --vault-name {vault_name} --query '[].{Name:name, Enabled:attributes.enabled, Created:attributes.created, Expires:attributes.expires}' -o table"
      - "Get-AzKeyVaultSecret -VaultName {vault_name} | Select-Object Name, @{N='Enabled';E={$_.Enabled}}, @{N='Created';E={$_.Created}}, @{N='Expires';E={$_.Expires}}, @{N='ContentType';E={$_.ContentType}} | Export-Csv -Path 'kv_secrets.csv' -NoTypeInformation"
    expected_output: "All secrets/keys with creation dates, expiry, and recovery levels"
    detection: "Secret list operations; key enumeration in Key Vault logs"

  - id: "step4"
    phase: "exploitation"
    action: "Attempt to retrieve secret values if permissions allow"
    commands:
      - "az keyvault secret show --name {secret_name} --vault-name {vault_name} --query 'value' -o tsv"
      - "(Get-AzKeyVaultSecret -VaultName {vault_name} -Name {secret_name}).SecretValueText"
      - "# If successful, test if the secret is a valid credential elsewhere"
      - "# e.g., test as Azure AD password, database connection string, API key"
    expected_output: "Plaintext secret value retrieved from Key Vault"
    detection: "Secret get operations in Key Vault logs; unexpected secret retrievals"

  - id: "step5"
    phase: "enumeration"
    action: "Check for secrets without expiration dates and old versions"
    commands:
      - "az keyvault secret list --vault-name {vault_name} --query '[?attributes.expires==null].{Name:name, Created:attributes.created}' -o table"
      - "# List all versions of a secret"
      - "az keyvault secret list-versions --name {secret_name} --vault-name {vault_name} --query '[].{Version:id, Created:attributes.created, Enabled:attributes.enabled}' -o table"
    expected_output: "Secrets without expiration and historical versions that may still be valid"
    detection: "Secret version enumeration operations"

  - id: "step6"
    phase: "post_exploitation"
    action: "Generate Key Vault security assessment report"
    commands:
      - "$report = @{ TotalVaults=(Import-Csv keyvaults.csv).Count; VaultsWithoutSoftDelete=(Import-Csv keyvaults.csv | Where-Object { $_.SoftDelete -ne 'True' }).Count; VaultsWithoutPurge=(Import-Csv keyvaults.csv | Where-Object { $_.PurgeProtection -ne 'True' }).Count; VaultsWithOpenNetwork=(Import-Csv keyvaults.csv | Where-Object { $_.NetworkDefault -eq 'Allow' }).Count; SecretsWithoutExpiry=(Import-Csv kv_secrets.csv | Where-Object { -not $_.Expires }).Count; PrincipalsWithGetAll=(Import-Csv kv_access_policies.csv | Where-Object { $_.SecretPerms -match 'Get|List|All' }).Count }; $report | ConvertTo-Json | Out-File 'kv_security_report.json'"
    expected_output: "kv_security_report.json with quantified security gaps"
    detection: "N/A - reporting step"

compliance_controls:
  - standard: "SOC 2"
    control: "CC6.1"
    description: "Logical access controls - verify Key Vault access governance"
  - standard: "SOC 2"
    control: "CC6.3"
    description: "RBAC - validate least privilege on secret access"
  - standard: "NIST 800-53"
    control: "AC-3"
    description: "Access Enforcement - Key Vault access policies"
  - standard: "CIS Azure"
    control: "8.4"
    description: "Ensure the key vault is recoverable"

detection:
  network_indicators:
    - "HTTPS requests to *.vault.azure.net/secrets/ and /keys/ endpoints"
    - "Bulk secret retrieval operations from single principal"
  log_indicators:
    - "Key Vault diagnostic logs: SecretGet, KeyGet, SecretList operations"
    - "Azure Activity Logs: Access policy modifications"
    - "Sign-In Logs: Authentication to Key Vault from new IPs"
  endpoint_indicators:
    - "Azure CLI executing az keyvault secret show commands"
    - "PowerShell Get-AzKeyVaultSecret with -AsPlainText"

remediation:
  immediate:
    - "Enable soft-delete and purge protection on all Key Vaults"
    - "Remove Get/List permissions from principals that don't need them"
    - "Set expiration dates on all secrets and keys"
    - "Enable RBAC authorization instead of access policies where possible"
    - "Set network ACLs to Deny by default with specific VNet/IP allow rules"
  long_term:
    - "Implement Azure Policy to enforce soft-delete and purge protection"
    - "Deploy automated secret rotation using Azure Automation or Azure Functions"
    - "Use managed identities instead of service principal secrets in Key Vault"
    - "Enable Key Vault logging to Log Analytics for monitoring"
    - "Quarterly access reviews of Key Vault permissions"
    - "Implement secret scanning in CI/CD pipelines to prevent hardcoded secrets"

variables:
  vault_name: "[TARGET_KEY_VAULT_NAME]"
  secret_name: "[TARGET_SECRET_NAME]"
  resource_group: "[RESOURCE_GROUP_NAME]"
  subscription_id: "[SUBSCRIPTION_ID]"

assessment_questions:
  - "Are all Key Vaults protected with soft-delete and purge protection?"
  - "How many principals have Get permissions on secrets they don't need?"
  - "What percentage of secrets have defined expiration dates?"
  - "Are old secret versions disabled or purged after rotation?"
  - "Is network access to Key Vault restricted to specific VNets/IPs?"

references:
  - url: "https://docs.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview"
    title: "Azure Key Vault Soft-Delete Overview"
  - url: "https://docs.microsoft.com/en-us/azure/key-vault/general/rbac-guide"
    title: "Azure Key Vault RBAC Guide"
  - url: "https://docs.microsoft.com/en-us/azure/key-vault/general/logging"
    title: "Azure Key Vault Logging"
