  target_policy_arn: "arn:aws:iam::123456789012:policy/UserPolicy"
  admin_username: "admin_user"
  admin_role_name: "AdminRole"
  account_id: "123456789012"
  admin_role: "AdminRole"
  attacker_ip: "10.10.10.1"
  aws_profile: "target"
  policy_name: "UserPolicy"

assessment_questions:
  - "What IAM permissions allow CreatePolicyVersion privilege escalation?"
  - "How does iam:PassRole combined with ec2:RunInstances lead to privilege escalation?"
  - "What is a permission boundary and how does it limit privilege escalation?"
  - "Which AWS service generates finding PrivilegeEscalation:IAMUser?"
  - "How do SCPs in AWS Organizations prevent privilege escalation?"

