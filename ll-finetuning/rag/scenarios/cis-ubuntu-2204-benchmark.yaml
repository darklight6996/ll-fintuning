name: "CIS Ubuntu 22.04 LTS Benchmark Assessment"
id: "cis-ubuntu-2204-001"
category: "Compliance"
subcategory: "CIS Benchmarks / Linux"
difficulty: "intermediate"
estimated_time: "120"

tags:
  - ubuntu
  - linux
  - cis-benchmark
  - compliance
  - security-audit
  - lynis
  - hardening
  - filesystem
  - logging
  - network-security

description: |
  Assess an Ubuntu 22.04 LTS system against CIS Benchmark Level 1 and Level 2
  controls. Covers filesystem configuration, services, network settings, auditing,
  access controls, and user/group management.

learning_objectives:
  - Audit Ubuntu 22.04 against CIS Benchmark Level 1 controls
  - Identify and remediate common hardening failures
  - Automate assessment using CIS-CAT or Lynis
  - Map controls to NIST 800-53 and PCI DSS

tools:
  - "Lynis"
  - "OpenSCAP"
  - "Bash"
  - "Auditd"
  - "UFW"

prerequisites:
  - "Root or sudo access to Ubuntu 22.04 LTS system"
  - "Basic Linux administration knowledge"
  - "Lynis or OpenSCAP installed"

steps:
  - id: "step1"
    phase: "reconnaissance"
    action: "Run Lynis automated hardening assessment"
    commands:
      - "apt-get install -y lynis"
      - "lynis audit system --no-colors 2>&1 | tee /tmp/lynis_report.txt"
      - "lynis audit system --pentest 2>&1 | tee /tmp/lynis_pentest.txt"
      - "cat /var/log/lynis.log | grep 'WARNING\\|SUGGESTION' | head -50"
      - "grep 'Hardening index' /tmp/lynis_report.txt"
    expected_output: "Lynis hardening index score and list of warnings/suggestions"
    detection: "No external detection — local system audit"

  - id: "step2"
    phase: "enumeration"
    action: "CIS 1.1 - Filesystem Configuration checks"
    commands:
      - "# 1.1.1.1 - Ensure cramfs is disabled"
      - "modprobe -n -v cramfs 2>&1"
      - "lsmod | grep cramfs"
      - "# 1.1.1.2 - Ensure freevxfs is disabled"
      - "modprobe -n -v freevxfs 2>&1"
      - "# 1.1.1.3 - Ensure jffs2 is disabled"
      - "modprobe -n -v jffs2 2>&1"
      - "# 1.1.2 - Ensure /tmp is configured"
      - "findmnt -n /tmp"
      - "mount | grep /tmp"
      - "# 1.1.2.1 - Ensure nodev on /tmp"
      - "findmnt -n /tmp | grep -v nodev && echo 'FAIL: nodev missing on /tmp' || echo 'PASS'"
      - "# 1.1.2.2 - Ensure nosuid on /tmp"
      - "findmnt -n /tmp | grep -v nosuid && echo 'FAIL: nosuid missing on /tmp' || echo 'PASS'"
      - "# 1.1.2.3 - Ensure noexec on /tmp"
      - "findmnt -n /tmp | grep -v noexec && echo 'FAIL: noexec missing on /tmp' || echo 'PASS'"
    expected_output: "Filesystem mount options and disabled kernel module status"
    detection: "Local audit — no external detection"

  - id: "step3"
    phase: "enumeration"
    action: "CIS 1.5 - Bootloader and process hardening"
    commands:
      - "# 1.5.1 - Ensure GRUB password is set"
      - "grep -E '^set superusers|^password' /boot/grub/grub.cfg"
      - "# 1.5.2 - Ensure bootloader permissions"
      - "stat /boot/grub/grub.cfg | grep Access"
      - "# 1.5.3 - Ensure authentication required for single user mode"
      - "grep -E '^ExecStart' /usr/lib/systemd/system/rescue.service"
      - "# 1.6.1 - Ensure XD/NX support is enabled"
      - "journalctl | grep 'protection: active'"
      - "dmesg | grep -i 'execute disable\\|NX (Execute Disable)'"
      - "# 1.6.2 - Ensure ASLR is enabled"
      - "sysctl kernel.randomize_va_space"
      - "cat /proc/sys/kernel/randomize_va_space"
      - "# 1.6.3 - Ensure prelink is not installed"
      - "dpkg -s prelink 2>&1 | grep -i 'installed\\|not installed'"
    expected_output: "Bootloader configuration, ASLR status, and process hardening settings"
    detection: "Local audit — no external detection"

  - id: "step4"
    phase: "enumeration"
    action: "CIS 2 - Services configuration checks"
    commands:
      - "# 2.1 - Ensure xinetd is not installed"
      - "dpkg -s xinetd 2>&1 | grep Status"
      - "# 2.1.1 - Ensure time sync is in use"
      - "systemctl is-enabled systemd-timesyncd 2>/dev/null || systemctl is-enabled ntp 2>/dev/null || systemctl is-enabled chrony 2>/dev/null"
      - "# 2.2.1 - Ensure X Window System is not installed"
      - "dpkg -l xserver-xorg* 2>/dev/null | grep '^ii'"
      - "# 2.2.2 - Ensure Avahi not enabled"
      - "systemctl is-enabled avahi-daemon 2>/dev/null"
      - "# 2.2.3 - Ensure CUPS not enabled"
      - "systemctl is-enabled cups 2>/dev/null"
      - "# 2.2.4 - Ensure DHCP server not enabled"
      - "systemctl is-enabled isc-dhcp-server 2>/dev/null"
      - "# 2.2.5 - Ensure LDAP server not enabled"
      - "systemctl is-enabled slapd 2>/dev/null"
      - "# List all enabled services"
      - "systemctl list-unit-files --type=service --state=enabled"
    expected_output: "List of enabled services and whether unnecessary services are running"
    detection: "Local audit — no external detection"

  - id: "step5"
    phase: "enumeration"
    action: "CIS 3 - Network configuration checks"
    commands:
      - "# 3.1.1 - Ensure packet redirect sending is disabled"
      - "sysctl net.ipv4.conf.all.send_redirects"
      - "sysctl net.ipv4.conf.default.send_redirects"
      - "# 3.2.1 - Ensure source routed packets are not accepted"
      - "sysctl net.ipv4.conf.all.accept_source_route"
      - "sysctl net.ipv4.conf.default.accept_source_route"
      - "# 3.2.2 - Ensure ICMP redirects not accepted"
      - "sysctl net.ipv4.conf.all.accept_redirects"
      - "# 3.2.3 - Ensure secure ICMP redirects not accepted"
      - "sysctl net.ipv4.conf.all.secure_redirects"
      - "# 3.2.4 - Ensure suspicious packets are logged"
      - "sysctl net.ipv4.conf.all.log_martians"
      - "# 3.3.1 - Ensure IPv6 router advertisements not accepted"
      - "sysctl net.ipv6.conf.all.accept_ra"
      - "# 3.4.1 - Ensure ufw is installed and active"
      - "dpkg -s ufw | grep Status"
      - "ufw status verbose"
    expected_output: "Kernel network parameter settings and firewall status"
    detection: "Local audit — no external detection"

  - id: "step6"
    phase: "enumeration"
    action: "CIS 4 - Logging and auditing checks"
    commands:
      - "# 4.1.1 - Ensure auditd is installed"
      - "dpkg -s auditd 2>&1 | grep Status"
      - "systemctl is-enabled auditd"
      - "# 4.1.2 - Ensure auditd service is enabled"
      - "systemctl is-active auditd"
      - "# 4.1.3 - Ensure auditing for processes that start prior to auditd"
      - "grep 'audit=1' /proc/cmdline"
      - "# 4.2 - Ensure audit log storage size is configured"
      - "grep max_log_file /etc/audit/auditd.conf"
      - "# 4.1.4 - Check audit rules for key events"
      - "auditctl -l | grep -E 'passwd|shadow|sudoers|login'"
      - "cat /etc/audit/rules.d/*.rules 2>/dev/null"
      - "# 4.2.1 - Ensure rsyslog is installed"
      - "dpkg -s rsyslog | grep Status"
      - "systemctl is-enabled rsyslog"
    expected_output: "Auditd configuration, active audit rules, and syslog settings"
    detection: "Local audit — no external detection"

  - id: "step7"
    phase: "enumeration"
    action: "CIS 5 - Access, authentication and authorization"
    commands:
      - "# 5.1.1 - Ensure cron daemon is enabled"
      - "systemctl is-enabled cron"
      - "# 5.1.2 - Ensure /etc/crontab permissions"
      - "stat /etc/crontab | grep Access"
      - "# 5.2 - SSH server configuration"
      - "grep -E '^Protocol|^LogLevel|^PermitRootLogin|^PermitEmptyPasswords|^MaxAuthTries|^IgnoreRhosts|^X11Forwarding|^AllowTcpForwarding|^PasswordAuthentication|^PubkeyAuthentication' /etc/ssh/sshd_config"
      - "# 5.2.1 - Ensure SSH Protocol is 2"
      - "grep '^Protocol' /etc/ssh/sshd_config"
      - "# 5.2.5 - Ensure SSH MaxAuthTries is 4 or less"
      - "grep '^MaxAuthTries' /etc/ssh/sshd_config"
      - "# 5.3 - Configure PAM"
      - "grep -E 'pam_pwquality|pam_cracklib' /etc/pam.d/common-password"
      - "cat /etc/security/pwquality.conf | grep -v '^#'"
      - "# 5.4 - User account settings"
      - "grep PASS_MAX_DAYS /etc/login.defs"
      - "grep PASS_MIN_DAYS /etc/login.defs"
      - "grep PASS_WARN_AGE /etc/login.defs"
    expected_output: "SSH configuration, PAM settings, and password policy"
    detection: "Local audit — no external detection"

  - id: "step8"
    phase: "enumeration"
    action: "CIS 6 - System maintenance and file permissions"
    commands:
      - "# 6.1.1 - Audit system file permissions"
      - "dpkg --verify 2>&1 | grep -v '^$' | head -20"
      - "# 6.1.2 - Ensure /etc/passwd permissions"
      - "stat /etc/passwd | grep Access"
      - "# 6.1.3 - Ensure /etc/shadow permissions"
      - "stat /etc/shadow | grep Access"
      - "# 6.1.4 - Ensure /etc/group permissions"
      - "stat /etc/group | grep Access"
      - "# 6.1.5 - Ensure /etc/gshadow permissions"
      - "stat /etc/gshadow | grep Access"
      - "# 6.2 - User and group settings"
      - "# Check for UID 0 accounts (only root should be UID 0)"
      - "awk -F: '($3 == 0) { print $1 }' /etc/passwd"
      - "# Check for accounts with empty passwords"
      - "awk -F: '($2 == \"\") { print $1 }' /etc/shadow"
      - "# Check for duplicate UIDs"
      - "awk -F: '{print $3}' /etc/passwd | sort | uniq -d"
      - "# Find world-writable files"
      - "find / -xdev -type f -perm -0002 -not -path '/proc/*' 2>/dev/null | head -20"
      - "# Find SUID/SGID executables"
      - "find / -xdev \\( -perm -4000 -o -perm -2000 \\) -type f 2>/dev/null"
    expected_output: "File permissions, user account security status, SUID/SGID file list"
    detection: "Local audit — no external detection"

compliance_controls:
  - standard: "CIS Ubuntu Linux 22.04 LTS Benchmark v1.0.0"
    control: "1.1 - 6.2"
    description: "Full CIS Level 1 and Level 2 controls for Ubuntu 22.04 LTS"
  - standard: "NIST 800-53 Rev5"
    control: "CM-6"
    description: "Configuration settings"
  - standard: "PCI DSS v4.0"
    control: "2.2.1"
    description: "Configuration standards for all system components"
  - standard: "SOC2 CC7.1"
    control: "CC7.1"
    description: "Vulnerability management and system monitoring"

detection:
  network_indicators:
    - "N/A - This is a local compliance assessment"
  log_indicators:
    - "Auditd events for compliance tool execution"
    - "Auth log entries for assessment tool access"
  endpoint_indicators:
    - "Lynis report generated at /var/log/lynis.log"
    - "OpenSCAP report generated at /tmp/scap_report.html"

remediation:
  immediate:
    - "Disable all unnecessary filesystem modules (cramfs, freevxfs, jffs2)"
    - "Set nodev, nosuid, noexec on /tmp, /var/tmp, /dev/shm"
    - "Enable and configure auditd with CIS-recommended rules"
    - "Harden SSH: disable root login, set MaxAuthTries 4, disable X11 forwarding"
  long_term:
    - "Apply all CIS Level 1 and Level 2 controls via Ansible hardening playbook"
    - "Integrate CIS-CAT Pro into CI/CD pipeline for baseline enforcement"
    - "Schedule weekly Lynis audits with automated alerting on regression"
    - "Maintain a hardened golden image based on CIS benchmark"

variables:
  target_host: "ubuntu-server-01"
  audit_output_dir: "/tmp/cis_audit"

assessment_questions:
  - "What is the difference between CIS Benchmark Level 1 and Level 2?"
  - "Which sysctl parameter controls ASLR on Linux systems?"
  - "Why should the /tmp partition be mounted with noexec,nosuid,nodev?"
  - "What Lynis hardening index score is considered acceptable?"
  - "How does auditd help with CIS compliance versus syslog?"

references:
  - url: "https://www.cisecurity.org/benchmark/ubuntu_linux"
    title: "CIS Ubuntu Linux 22.04 LTS Benchmark"
  - url: "https://cisofy.com/lynis/"
    title: "Lynis Security Auditing Tool"
  - url: "https://www.open-scap.org/"
    title: "OpenSCAP"
  - url: "https://github.com/konstruktoid/hardening"
    title: "Ubuntu Hardening Ansible Playbook"
